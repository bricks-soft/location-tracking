name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            example/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Use the preinstalled Android SDK
        run: echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"

      - name: Build and test TypeScript
        run: |
          npm ci
          npm run build
          npm test

      - name: Android unit tests
        working-directory: android
        run: gradle testDebugUnitTest --console=plain

      - name: Build example app (GMS + HMS)
        working-directory: example
        run: |
          npm ci
          npm run sync
          cd android
          gradle assembleDebug -PlocationTracking.providers=gms,hms --console=plain

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: android/build/reports/tests/
